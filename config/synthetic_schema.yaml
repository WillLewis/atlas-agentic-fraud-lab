# config/synthetic_schema.yaml
# Schema for the synthetic environment. See PROJECT_ATLAS_BIBLE.md §11 and
# PROJECT_ATLAS_COMPONENT_ARCHITECTURE_DATA_API.md §2.1.
#
# This file is the contract between the Phase 2 generators and the rest of
# the system. Field names and ID prefixes here MUST match
# project_atlas_sample_data.json (canonical fixture) and the architecture
# doc's entity tables. The Phase 1 frontend (app/web/lib/types.ts) and the
# eventual Phase 4 OpenAPI schemas key off these same names.

schema_version: 2
schema_label: atlas_synthetic_v2

# --- Entities ---
entities:
  customer:
    id_prefix: cust_
    fields:
      - { name: customer_id, type: string }
      - { name: customer_segment, type: string }
      - { name: home_region_bucket, type: string }
      - { name: account_age_days, type: int }
      - { name: normal_login_frequency_30d, type: int }
      - { name: normal_transfer_frequency_30d, type: int }
      - { name: synthetic_base_risk, type: float }
      - { name: created_from_seed, type: int }

  account:
    id_prefix: acct_
    fields:
      - { name: account_id, type: string }
      - { name: customer_id, type: string }
      - { name: account_type, type: string }
      - { name: opened_days_ago, type: int }
      - { name: available_balance_bucket, type: string }
      - { name: account_status, type: string }

  device:
    id_prefix: dev_
    fields:
      - { name: device_id, type: string }
      - { name: customer_id, type: string }
      - { name: device_channel, type: string }
      - { name: first_seen_days_ago, type: int }
      - { name: login_count_30d, type: int }
      - { name: is_current_event_device, type: bool }

  recipient:
    # Fixture uses recip_* IDs (e.g. recip_000077). The earlier `recipient_`
    # prefix was stale; the safety-scanner allow-list mirrors this change.
    id_prefix: recip_
    fields:
      - { name: recipient_id, type: string }
      - { name: first_seen_days_ago, type: int }
      - { name: recipient_reuse_degree, type: int }
      - { name: recipient_risk_bucket, type: string }

  external_account:
    id_prefix: extacct_
    fields:
      - { name: external_account_id, type: string }
      - { name: customer_id, type: string }
      - { name: linked_days_ago, type: int }
      - { name: verification_method, type: string }
      - { name: external_account_risk_bucket, type: string }

# --- Graph ---
graph:
  edge_id_prefix: edge_
  edge_kinds:
    - shared_device
    - shared_recipient
    - shared_external_account
    - shared_region
    - uses_device
    - attempted_transfer_to
  graph_edge_fields:
    - { name: edge_id, type: string }
    - { name: source_node_id, type: string }
    - { name: source_node_type, type: string }
    - { name: target_node_id, type: string }
    - { name: target_node_type, type: string }
    - { name: relationship_type, type: string }
    - { name: first_seen_days_ago, type: int }
    - { name: event_count, type: int }
  # Phase-3 graph features. Listed here for completeness; not computed in
  # Phase 2.
  features:
    - shared_device_degree
    - shared_recipient_degree
    - entity_graph_risk_score

# --- Events ---
# Three concrete tables matching the fixture envelope. Each table has its
# own ID prefix and required-field set. Phase 2 generators emit these three;
# Phase 6+ red-team candidate event histories reuse the `evt_` prefix.
events:
  allowed_types:
    - login_success
    - login_challenge_required
    - challenge_passed
    - challenge_failed
    - password_recovery_completed
    - username_recovery_completed
    - profile_update
    - recipient_added
    - external_account_link_attempt
    - instant_transfer_attempt
    - external_transfer_attempt
    - large_transfer_attempt

  tables:
    login_sessions:
      id_prefix: sess_
      required_fields:
        - session_id
        - customer_id
        - device_id
        - event_time_utc
        - channel
        - region_bucket
        - challenge_required
        - challenge_result

    security_events:
      id_prefix: sec_
      required_fields:
        - security_event_id
        - customer_id
        - session_id
        - event_type
        - event_time_utc
        - device_id
        - safe_risk_marker

    transfer_events:
      id_prefix: tx_
      required_fields:
        - transfer_event_id
        - customer_id
        - account_id
        - event_type
        - event_time_utc
        - amount_bucket
        - recipient_id
        - channel
        - synthetic_truth_label

# --- Label generation ---
label_generation:
  # Fixture example IDs in arch-doc §2.1: label_tx_000002 — labels reuse the
  # source transfer-event ID with a `label_tx_` prefix.
  id_prefix: label_tx_
  required_fields:
    - event_id
    - latent_drivers
    - synthetic_risk_probability
    - synthetic_truth_label
  allowed_label_values:
    - normal_activity
    - high_risk_synthetic_activity

# --- Synthetic label generation drivers ---
label_drivers:
  - base_customer_risk
  - account_access_change_marker
  - device_novelty_marker
  - security_recovery_marker
  - cash_movement_velocity_marker
  - entity_reuse_marker
  - ring_membership_marker
  - label_noise

# --- Feature families (Phase 3 surface; not generated in Phase 2) ---
feature_families:
  - name: login
    members:
      - login_count_72h
      - login_count_30d
      - login_velocity_ratio
  - name: challenge
    members:
      - challenge_count_72h
      - challenge_pass_ratio_30d
  - name: recovery
    members:
      - password_recovery_count_72h
      - username_recovery_count_72h
  - name: device
    members:
      - device_count_72h
      - current_device_tenure_days
  - name: geo
    members:
      - geo_consistency_flag
      - region_change_count_72h
  - name: transfer
    members:
      - transfer_count_72h
      - cash_movement_velocity_score
  - name: recipient
    members:
      - recipient_tenure_days
      - new_recipient_indicator
  - name: graph
    members:
      - shared_device_degree
      - shared_recipient_degree
      - entity_graph_risk_score
  - name: account
    members:
      - account_age_days

# --- Splits ---
splits:
  split_by: customer_id
  partitions:
    - name: train
      fraction: 0.60
    - name: validation
      fraction: 0.10
    - name: clean_holdout
      fraction: 0.10
    - name: locked_adaptive_holdout
      fraction: 0.10
      locked: true
    - name: drifted_holdout
      fraction: 0.10
      locked: true

# --- Synthetic model vulnerability families ---
model_vulnerability_families:
  - id: low_velocity_high_graph_risk
  - id: recent_change_feature_delay
  - id: score_boundary_cluster
  - id: activity_channel_shift
  - id: current_device_mismatch
  - id: label_noise_mislearned
  - id: overfit_fix_failure

# --- Generation safety guards ---
generation_guards:
  forbid_real_pii_fields: true
  require_synthetic_id_prefixes: true
  debug_direct_feature_mutation_default: false
