# config/model_quality_matrix.yaml
# Model-tier comparison matrix. See PROJECT_ATLAS_BIBLE.md §17.
# Public copy uses tier labels only (Frontier / Compact). Concrete model IDs
# are revealed only when explicitly configured for a private demo.

model_quality_matrix_version: matrix_v1

tiers:
  frontier:
    label: Frontier
    description: Stronger reasoning agent tier used for comparison runs.
    public_safe_label: Frontier
  compact:
    label: Compact
    description: Smaller, lower-cost agent tier used for comparison runs.
    public_safe_label: Compact

# Concrete model identifiers per tier. These are only used when
# expose_concrete_model_names is true (private demo). In public mode the web
# app and API surface only the tier labels above.
tier_models:
  frontier:
    primary: claude-opus-4-7
    fallback: claude-sonnet-4-6
  compact:
    primary: claude-haiku-4-5-20251001
    fallback: claude-haiku-4-5-20251001

# Visibility controls.
expose_concrete_model_names: false
public_safe_default: true

# Four run cells. Public app shows tier labels plus judge-derived metrics when
# a reviewed replay artifact is attached. Cells without a source replay report
# unavailable metrics explicitly; they never use zero-valued stand-ins.
runs:
  - run_label: A
    red_team_tier: frontier
    bank_defense_tier: frontier
    purpose: Best-case agentic loop.
    source_run_id: run_4548ebb8
    metrics_source: judge_derived_replay
  - run_label: B
    red_team_tier: compact
    bank_defense_tier: frontier
    purpose: Strong defense, weaker red-team testing.
    source_run_id: null
    metrics_source: unavailable
  - run_label: C
    red_team_tier: frontier
    bank_defense_tier: compact
    purpose: Stress case — strong red-team testing, weaker defense.
    source_run_id: null
    metrics_source: unavailable
  - run_label: D
    red_team_tier: compact
    bank_defense_tier: compact
    purpose: Low-cost baseline.
    source_run_id: null
    metrics_source: unavailable

# Summary findings to display in the model-tier comparison card. These lines
# describe what is present in the curated public demo artifacts.
summary_templates:
  - Curated replay A shows lower model miss rate after the accepted defensive fix.
  - Cells without a curated replay artifact report unavailable metrics, not zero values.
  - Displayed outcomes come from deterministic judge-derived replay metrics.
